about_content: |
  Hi, I'm Vrushabh — a cross-platform mobile and Smart TV developer with experience building applications for iOS, Android, Android TV, Fire TV, webOS, Tizen, tablets, and the web.

  I started my career working on a variety of apps including accounting tools, medical apps, social/chat apps, and smart device–connected apps. Later, I worked as a freelancer developing fitness-related mobile apps. 

  Currently, I work as a consultant for a U.S. startup, where I build OTT applications end-to-end across multiple platforms. Due to NDA restrictions, I cannot share project-specific details, but I can outline the technologies, capabilities, and problem-solving approaches I use.

  I am most skilled in: <mark>React Native</mark>, <mark>Smart TV Development</mark>, <mark>Cross-Platform Architecture</mark>, and <mark>Frontend Engineering</mark>.

